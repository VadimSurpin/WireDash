# ZigDash relay broker. Logins and per-home access rules come from the
# dynamic-security plugin (data/dynsec.json), managed by the verifier.
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
per_listener_settings false
max_inflight_messages 20
max_queued_messages 200
message_size_limit 65536

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynsec.json

# Internal: the verifier's admin connection. Not published outside Docker.
listener 1883 0.0.0.0
protocol mqtt

# Hubs: MQTT over TLS with Caddy's Let's Encrypt certificate.
listener 8883 0.0.0.0
protocol mqtt
certfile /certs/relay.zigdash.app.crt
keyfile /certs/relay.zigdash.app.key

# Phones: MQTT over WebSocket, behind Caddy's TLS on 443 at /mqtt.
listener 9001 0.0.0.0
protocol websockets
