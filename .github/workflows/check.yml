name: check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - name: Read pinned Flutter version
        id: flutter_android
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_android.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --flavor foss --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: zigdash-wirenboard-debug-arm64
          path: build/app/outputs/flutter-apk/app-foss-debug.apk
          if-no-files-found: error

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build JavaScript engine for native tests
        run: python3 tool/build_display_js_native.py

      - uses: actions/upload-artifact@v4
        with:
          name: display-js-native-linux
          path: .dart_tool/display-js-native/libjsf.so
          include-hidden-files: true
          if-no-files-found: error

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      - run: flutter analyze

      - name: Tests (golden images included)
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
