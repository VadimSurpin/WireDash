name: check

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build release APKs after all checks pass
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wireguard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/wireguard/go.mod
          cache-dependency-path: native/wireguard/go.sum
      - run: go test -race ./...
        working-directory: native/wireguard
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - name: Read pinned Flutter version
        id: flutter_android
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_android.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug --flavor foss --split-per-abi --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wiredash-debug-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-foss-debug.apk
          if-no-files-found: error

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build JavaScript engine for native tests
        run: python3 tool/build_display_js_native.py

      - uses: actions/upload-artifact@v4
        with:
          name: display-js-native-linux
          path: .dart_tool/display-js-native/libjsf.so
          include-hidden-files: true
          if-no-files-found: error

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      - run: flutter analyze

      - name: Tests (golden images included)
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  release-apks:
    # Release builds run only after all functional, visual and Go checks pass.
    if: startsWith(github.ref, 'refs/heads/feat/release-') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    needs: [wireguard, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/wireguard/go.mod
          cache-dependency-path: native/wireguard/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - name: Read pinned Flutter version
        id: flutter_release
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_release.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release-mode FOSS APKs for all supported ABIs
        run: tool/build_release.sh github
      # No private signing key is stored in CI. The maintainer re-signs and
      # verifies downloaded APKs before publishing; checksums are recomputed.
      - uses: actions/upload-artifact@v4
        with:
          name: wiredash-release-apks
          path: build/github-release/
          if-no-files-found: error
