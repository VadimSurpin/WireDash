name: car-preview

on:
  workflow_dispatch:
  push:
    branches: ['feat/android-auto']
    paths:
      - '.github/workflows/car-preview.yml'
      - 'tool/car_preview/**'

concurrency:
  group: car-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automotive-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/wireguard/go.mod
          cache-dependency-path: native/wireguard/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install emulator and current Automotive template host
        run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973' emulator 'system-images;android-35-ext15;android-automotive;x86_64'
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate isolated demo dashboard
        run: flutter test tool/car_preview/create_fixture.dart
      - name: Build x86_64 emulator harness with the unchanged car screens
        run: |
          mkdir -p android/app/src/fossDebug
          cp tool/car_preview/AndroidManifest.xml android/app/src/fossDebug/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          source = build.read_text()
          projected = 'androidx.car.app:app-projected:1.8.0-rc01'
          assert source.count(projected) == 1
          source = source.replace(projected, 'androidx.car.app:app-automotive:1.8.0-rc01')
          build.write_text(source + '\nandroid { defaultConfig { minSdk = 29 } }\n')
          PY
          flutter build apk --debug --flavor foss --split-per-abi --target-platform android-x64
          (cd android && ./gradlew --stop)
      - name: Run Automotive emulator and capture actual host UI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          sudo chmod 666 /dev/kvm
          python3 tool/car_preview/capture.py
      - name: Upload screenshots and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiredash-car-emulator-preview
          path: build/car-preview/
          if-no-files-found: error
